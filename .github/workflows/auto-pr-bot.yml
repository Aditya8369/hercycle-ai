name: Auto PR Bot & Maintainer Helper

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-label-and-format:
    name: Auto Label & Format PR
    runs-on: ubuntu-latest
    steps:
      - name: Auto Format Title with [ECSoC26] Prefix
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$CURRENT_TITLE" != *"ECSoC26"* && "$CURRENT_TITLE" != *"ECSoC"* ]]; then
            NEW_TITLE="[ECSoC26] $CURRENT_TITLE"
            echo "Formatting PR #$PR_NUMBER title: $NEW_TITLE"
            gh pr edit "$PR_NUMBER" --title "$NEW_TITLE" --repo "$GITHUB_REPOSITORY" || true
          fi

      - name: Auto Label ECSoC26 & Domain Categories
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Helper function to ensure label exists before applying
          ensure_label() {
            local label_name="$1"
            local color="$2"
            gh label create "$label_name" --color "$color" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "$label_name" --repo "$GITHUB_REPOSITORY" 2>/dev/null || \
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=$label_name" 2>/dev/null || true
          }

          echo "Ensuring and applying ECSoC26 label to PR #$PR_NUMBER..."
          ensure_label "ECSoC26" "e11d48"

          FILES_CHANGED=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "")

          if echo "$FILES_CHANGED" | grep -qE "^(app/|components/|public/|messages/)"; then
            ensure_label "frontend" "3b82f6"
          fi
          if echo "$FILES_CHANGED" | grep -qE "^(app/api/|lib/|supabase/)"; then
            ensure_label "backend" "10b981"
          fi
          if echo "$FILES_CHANGED" | grep -qE "^(docs/|\.md)"; then
            ensure_label "documentation" "8b5cf6"
          fi
          if echo "$FILES_CHANGED" | grep -qE "^(e2e/|tests/|scripts/)"; then
            ensure_label "e2e-testing" "f59e0b"
          fi

      - name: Attempt Branch Sync with Main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Attempting branch update from main for PR #$PR_NUMBER..."
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/update-branch" -X PUT 2>/dev/null || true

      - name: Post Maintainer Verification Comment
        if: github.event.action == 'opened'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_BODY="### 🌸 HerCycle AI Automated PR Helper

          - **Title Formatting**: Verified \`[ECSoC26]\` title prefix ✅
          - **Labeling**: Applied \`ECSoC26\` + domain labels automatically ✅
          - **CI Checks**: Running automated build & E2E integration tests 🧪

          *Maintainers will review and merge this PR once CI checks pass!* 🚀"

          gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY" --repo "$GITHUB_REPOSITORY" || true
