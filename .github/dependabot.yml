# GitHub Dependabot Configuration File
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. Update dependencies in package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly" # Check for updates weekly to avoid PR noise
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3 # Limit total open Dependabot PRs
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ECSoC26"

  # 2. Update GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
