services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hercycle_app
    ports:
      - "3000:3000"
    volumes:
      # Bind mount current directory to support hot-reloading
      - .:/app
      # Exclude copying host's node_modules and .next directories to prevent OS mismatches
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_MOCK_DB=true  # Fallback to decoupled mock db for easy dev setup
    env_file:
      - .env.local
    restart: always
